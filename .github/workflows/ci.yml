name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false # dlmod has no dependencies to cache

      - name: HUD engine, observer and HUD tests
        run: node --test test/intelligence.test.js

      - name: Build, catalog and match-data tests
        run: python -m unittest discover -s test -v

      - name: dlmod format, vet and tests
        working-directory: tools/dlmod
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "::error::Run gofmt on: $unformatted"; exit 1; }
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...

      - name: Build the mod against the live stock HUD
        run: |
          curl -fsSL https://raw.githubusercontent.com/SteamTracking/GameTracking-Deadlock/master/game/citadel/pak01_dir/panorama/layout/hud.xml \
            -o stock-hud.xml
          python tools/build.py --hud-xml stock-hud.xml --output dist/check.zip

      - name: Build dlmod for Windows and Linux
        working-directory: tools/dlmod
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -o /dev/null .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /dev/null .
