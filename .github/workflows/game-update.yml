name: Game update

# Once a day: when Deadlock's client build changes, refresh the item catalog and the match data,
# run every test and a build against the new stock HUD, commit the result to main, and start the
# Release workflow for the next patch version. An interface mod built for an older game build can
# stop the game from starting, so releases have to follow game updates.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh and release even if the game build did not change"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: game-update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # tags, to pick the next version

      - name: Compare the live game build with the catalog
        id: check
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          live=$(curl -fsSL https://raw.githubusercontent.com/SteamTracking/GameTracking-Deadlock/master/game/citadel/steam.inf \
            | sed -n 's/^ClientVersion=\([0-9]*\).*/\1/p')
          catalog=$(python3 -c "import json; print(json.load(open('src/catalog.json'))['clientVersion'])")
          echo "Live build ${live:-unknown}, catalog build $catalog"
          [[ "$live" =~ ^[0-9]+$ ]] || { echo "::error::Could not read the live game build"; exit 1; }
          if [ "$live" != "$catalog" ] || [ "$FORCE" = "true" ]; then changed=true; else changed=false; fi
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.changed == 'true'
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        if: steps.check.outputs.changed == 'true'
        with:
          go-version: "1.24"
          cache: false # dlmod has no dependencies to cache

      - name: Refresh the catalog and the match data
        id: refresh
        if: steps.check.outputs.changed == 'true'
        env:
          LIVE: ${{ steps.check.outputs.live }}
        run: |
          # deadlock-api can lag a few hours behind a game update; tomorrow's run tries again.
          if ! python tools/update_catalog.py "$LIVE"; then
            echo "::warning::deadlock-api has no catalog for build $LIVE yet; trying again on the next run"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tools/update_counter_stats.py
          # A release must not wait on the game-data comparison: an outdated HUD can stop the game from starting.
          if ! python tools/patch_notes.py; then
            echo "::warning::The game-data comparison failed; the patch warnings come from the patch notes alone"
            python tools/patch_notes.py --notes-only
          fi
          sed -i -E "s/client build \*\*[0-9]+\*\*/client build **$LIVE**/; s/update_catalog\.py [0-9]+/update_catalog.py $LIVE/" README.md
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Run every test and build against the new stock HUD
        if: steps.refresh.outputs.ready == 'true'
        run: |
          node --test test/intelligence.test.js
          python -m unittest discover -s test -v
          (cd tools/dlmod && go vet ./... && go test ./...)
          curl -fsSL https://raw.githubusercontent.com/SteamTracking/GameTracking-Deadlock/master/game/citadel/pak01_dir/panorama/layout/hud.xml \
            -o stock-hud.xml
          python tools/build.py --hud-xml stock-hud.xml --output dist/check.zip

      - name: Commit the update and write release notes
        id: commit
        if: steps.refresh.outputs.ready == 'true'
        env:
          LIVE: ${{ steps.check.outputs.live }}
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          next=$(python3 -c "import sys; major, minor, patch = sys.argv[1].lstrip('v').split('.'); print(f'v{major}.{minor}.{int(patch) + 1}')" "${last:-v0.0.0}")
          patch=$(python3 -c "import json; p = json.load(open('src/stats.json')).get('patch'); print(p['title'] if p else 'the last 30 days')")
          window=$(python3 -c "import json; w = json.load(open('src/stats.json'))['window']; print(w['from'] + ' to ' + w['to'])")
          {
            echo "# $next · Update for Deadlock build $LIVE"
            echo
            echo "Automatic update for Deadlock client build **$LIVE**, made by the Game update workflow."
            echo
            echo "- The HUD is built from the build $LIVE stock interface. An interface mod built for an older game build can stop the game from starting, so update the mod after every game update."
            echo "- The item catalog and the match data are refreshed. Match data covers $window (since $patch)."
            echo "- Heroes and items changed by patches the counter table has not been reviewed for, or by value changes in the game data that no patch note mentions, are marked **PATCHED** in the HUD; hover the mark to see what changed."
            echo "- \`dlmod update\` (or \`u\` in dlmod's full-screen view) downloads this HUD for the installed game build and replaces the old one."
            echo
            echo "Every test passed and the mod was built against the new stock HUD before this release was published. Display in Deadlock is not verified automatically."
          } > ".github/release-notes/$next.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catalog.json src/stats.json src/patches.json docs/counter-data.md README.md ".github/release-notes/$next.md"
          git commit -m "Update for Deadlock build $LIVE" -m "Refreshed catalog and match data ($window). Release notes for $next."
          git push origin HEAD:main
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Start the release
        if: steps.commit.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.commit.outputs.version }}
        run: gh workflow run release.yml --ref main -f version="$VERSION"
