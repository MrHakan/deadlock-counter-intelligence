name: Release

# Runs when a v* tag is pushed, or from the Actions tab (Run workflow) with a version. A manual
# run creates the tag itself, on the commit it builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as v0.2.0 (needs .github/release-notes/<version>.md)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not a version such as v0.2.0"; exit 1; }
          test -f ".github/release-notes/$VERSION.md" || { echo "::error::Missing .github/release-notes/$VERSION.md"; exit 1; }
          if gh release view "$VERSION" > /dev/null 2>&1; then echo "::error::Release $VERSION already exists"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run tests
        run: |
          node --test test/intelligence.test.js
          python -m unittest discover -s test -v
          (cd tools/dlmod && go vet ./... && go test ./...)

      - name: Fetch the stock HUD for the catalog build
        run: |
          base=https://raw.githubusercontent.com/SteamTracking/GameTracking-Deadlock/master/game/citadel
          curl -fsSL "$base/steam.inf" -o steam.inf
          curl -fsSL "$base/pak01_dir/panorama/layout/hud.xml" -o stock-hud.xml
          live=$(sed -n 's/^ClientVersion=\([0-9]*\).*/\1/p' steam.inf)
          catalog=$(python -c "import json; print(json.load(open('src/catalog.json'))['clientVersion'])")
          echo "Live build $live, catalog build $catalog"
          test "$live" = "$catalog" || { echo "::error::Stock HUD is build $live but the catalog is $catalog"; exit 1; }
          echo "BUILD=$catalog" >> "$GITHUB_ENV"

      - name: Build
        run: |
          python tools/build.py --hud-xml stock-hud.xml \
            --output "dist/deadlock-counter-intelligence-${BUILD}-hud-en.zip"

      - name: Build dlmod
        working-directory: tools/dlmod
        run: |
          flags="-s -w -X main.version=${VERSION}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$flags" -o ../../dist/dlmod-windows-amd64.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$flags" -o ../../dist/dlmod-linux-amd64 .

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${VERSION}.md"
          title=$(head -n 1 "$notes" | sed 's/^# //')
          tail -n +3 "$notes" > notes-body.md
          gh release create "$VERSION" dist/*.zip dist/dlmod-* --target "$GITHUB_SHA" --title "$title" --notes-file notes-body.md
